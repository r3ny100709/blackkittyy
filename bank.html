<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bank</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    min-height:100%;

    background:#777;

    font-family:Arial,sans-serif;
}

button{
    font:inherit;
}

.bank{
    width:min(500px,94vw);

    margin:30px auto;

    padding:24px;

    background:#111;

    color:white;

    border-radius:30px;

    box-shadow:0 15px 50px rgba(0,0,0,.4);
}

.header{
    display:flex;
    align-items:center;
    gap:12px;

    margin-bottom:20px;
}

.back{
    width:44px;
    height:44px;

    border:0;
    border-radius:14px;

    background:#292929;
    color:white;

    font-size:20px;

    cursor:pointer;
}

h1{
    margin:0;
    font-size:25px;
}

.balance-card{
    padding:24px;

    border-radius:24px;

    background:
        linear-gradient(
            135deg,
            #222,
            #090909
        );

    border:1px solid #444;

    margin-bottom:18px;
}

.label{
    color:#aaa;
    font-size:14px;
}

.balance{
    margin-top:8px;

    font-size:34px;
    font-weight:bold;
}

.account{
    margin-top:15px;

    color:#aaa;
    font-size:14px;
}

.payment{
    padding:20px;

    border-radius:22px;

    background:#202020;

    display:none;
}

.payment-title{
    color:#aaa;
    font-size:14px;
}

.payment-name{
    margin-top:8px;

    font-size:19px;
    font-weight:bold;
}

.payment-price{
    margin-top:5px;

    font-size:28px;
    font-weight:bold;
}

.pay{
    width:100%;

    min-height:52px;

    margin-top:18px;

    border:0;
    border-radius:16px;

    background:white;
    color:#111;

    font-weight:bold;

    cursor:pointer;
}

.message{
    margin-top:15px;

    text-align:center;

    color:#ff7777;

    display:none;
}

.success{
    display:none;

    text-align:center;

    padding:35px 10px;
}

.success-icon{
    font-size:65px;
}

.success h2{
    margin-top:15px;
}

.success p{
    color:#aaa;
}

.home{
    width:100%;

    min-height:50px;

    margin-top:20px;

    border:0;
    border-radius:16px;

    background:white;
    color:#111;

    font-weight:bold;

    cursor:pointer;
}

</style>
</head>


<body>

<main class="bank">

    <div class="header">

        <button
            class="back"
            id="back"
            type="button"
        >
            ←
        </button>

        <h1>
            🏦 ธนาคาร
        </h1>

    </div>


    <!-- BALANCE -->

    <div class="balance-card">

        <div class="label">
            ยอดเงินคงเหลือ
        </div>

        <div
            class="balance"
            id="balance"
        >
            ฿10,000
        </div>

        <div class="account">
            เลขบัญชี xxx-xxxx
        </div>

    </div>


    <!-- PAYMENT -->

    <div
        class="payment"
        id="payment"
    >

        <div class="payment-title">
            รายการชำระเงิน
        </div>

        <div
            class="payment-name"
            id="paymentName"
        >
            -
        </div>

        <div
            class="payment-price"
            id="paymentPrice"
        >
            ฿0
        </div>

        <button
            class="pay"
            id="pay"
            type="button"
        >
            ยืนยันการชำระเงิน
        </button>

        <div
            class="message"
            id="message"
        >
            เงินไม่พอ
        </div>

    </div>


    <!-- SUCCESS -->

    <div
        class="success"
        id="success"
    >

        <div class="success-icon">
            ✅
        </div>

        <h2>
            ชำระเงินเรียบร้อย
        </h2>

        <p>
            รายการสั่งซื้อสำเร็จแล้ว
        </p>

        <button
            class="home"
            id="home"
            type="button"
        >
            กลับโทรศัพท์
        </button>

    </div>

</main>


<script>

/* =========================
   MONEY
========================= */

/*
   ถ้ายังไม่มีเงิน
   ให้เริ่มต้นที่ 10,000
*/

if(
    localStorage.getItem("balance") === null
){

    localStorage.setItem(
        "balance",
        "10000"
    );

}


/* =========================
   ELEMENTS
========================= */

const balanceText =
    document.getElementById("balance");

const payment =
    document.getElementById("payment");

const paymentName =
    document.getElementById("paymentName");

const paymentPrice =
    document.getElementById("paymentPrice");

const pay =
    document.getElementById("pay");

const message =
    document.getElementById("message");

const success =
    document.getElementById("success");


/* =========================
   UPDATE BALANCE
========================= */

function updateBalance(){

    const balance =
        Number(
            localStorage.getItem("balance")
        ) || 0;

    balanceText.textContent =
        "฿" +
        balance.toLocaleString("th-TH");

}

updateBalance();


/* =========================
   GET PENDING ITEM
========================= */

const pending =
    localStorage.getItem("pendingItem");


if(pending){

    const item =
        JSON.parse(pending);


    payment.style.display =
        "block";


    paymentName.textContent =
        item.name;


    paymentPrice.textContent =
        "฿" +
        item.price.toLocaleString("th-TH");

}


/* =========================
   PAY
========================= */

pay.addEventListener(
    "click",
    function(){

        const pending =
            localStorage.getItem(
                "pendingItem"
            );


        if(!pending){

            return;

        }


        const item =
            JSON.parse(pending);


        let balance =
            Number(
                localStorage.getItem(
                    "balance"
                )
            ) || 0;


        /*
           เงินไม่พอ
        */

        if(balance < item.price){

            message.style.display =
                "block";

            return;

        }


        /*
           หักเงิน
        */

        balance -= item.price;


        localStorage.setItem(
            "balance",
            String(balance)
        );


        /*
           ล้างรายการ
        */

        localStorage.removeItem(
            "pendingItem"
        );


        updateBalance();


        payment.style.display =
            "none";


        success.style.display =
            "block";

    }
);


/* =========================
   BACK
========================= */

document
    .getElementById("back")
    .addEventListener("click",function(){

        window.location.href =
            "phone.html";

    });


/* =========================
   SUCCESS → PHONE
========================= */

document
    .getElementById("home")
    .addEventListener("click",function(){

        window.location.href =
            "phone.html";

    });

</script>

</body>
</html>
