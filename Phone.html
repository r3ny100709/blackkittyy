<!DOCTYPE html>
<html lang="th">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Phone</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#777;
    font-family:Arial,sans-serif;
}

button{
    font:inherit;
}

.game{
    position:relative;
    width:100vw;
    height:100vh;
}

/* =========================
   PHONE BUTTON
========================= */

.phone-button{
    position:absolute;
    top:20px;
    right:20px;

    width:58px;
    height:58px;

    border:0;
    border-radius:18px;

    background:#111;
    color:white;

    font-size:28px;
    cursor:pointer;

    box-shadow:0 4px 15px rgba(0,0,0,.3);
}

/* =========================
   PHONE
========================= */

.phone{
    position:absolute;

    top:50%;
    left:50%;

    width:min(360px,92vw);
    height:min(700px,88vh);

    transform:translate(-50%,-50%);

    background:#111;

    border:5px solid #222;
    border-radius:38px;

    overflow:hidden;

    box-shadow:0 15px 50px rgba(0,0,0,.5);

    display:none;
}

/* =========================
   STATUS
========================= */

.phone-status{
    height:48px;

    padding:0 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#080808;
    color:white;

    font-size:13px;
}

/* =========================
   SCREEN
========================= */

.phone-screen{
    height:calc(100% - 48px);

    padding:20px;

    overflow:auto;

    background:linear-gradient(
        180deg,
        #242424,
        #101010
    );

    color:white;
}

/* =========================
   HOME
========================= */

.phone-title{
    margin:12px 0 25px;

    font-size:25px;
    font-weight:bold;
}

.apps{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.app{
    min-height:115px;

    border:0;
    border-radius:24px;

    background:#202020;
    color:white;

    cursor:pointer;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:8px;
}

.app-icon{
    font-size:42px;
}

.app-name{
    font-size:15px;
}

.close-phone{
    width:100%;

    margin-top:30px;

    min-height:45px;

    border:0;
    border-radius:15px;

    background:#292929;
    color:white;

    cursor:pointer;
}

</style>
</head>


<body>

<main class="game">

    <button
        class="phone-button"
        id="openPhone"
        type="button"
    >
        📱
    </button>


    <section
        class="phone"
        id="phone"
    >

        <div class="phone-status">

            <span id="time">
                12:00
            </span>

            <span>
                📶
                &nbsp;
                🔋 100%
            </span>

        </div>


        <div class="phone-screen">

            <div class="phone-title">
                My Phone
            </div>


            <div class="apps">

                <!-- SHOP -->

                <button
                    class="app"
                    id="openShop"
                    type="button"
                >

                    <span class="app-icon">
                        🛒
                    </span>

                    <span class="app-name">
                        Shop
                    </span>

                </button>


                <!-- BANK -->

                <button
                    class="app"
                    id="openBank"
                    type="button"
                >

                    <span class="app-icon">
                        🏦
                    </span>

                    <span class="app-name">
                        Bank
                    </span>

                </button>

            </div>


            <button
                class="close-phone"
                id="closePhone"
                type="button"
            >
                ปิดโทรศัพท์
            </button>

        </div>

    </section>

</main>


<script>

/* =========================
   OPEN PHONE
========================= */

document
    .getElementById("openPhone")
    .addEventListener("click",function(){

        document
            .getElementById("phone")
            .style.display = "block";

    });


/* =========================
   CLOSE PHONE
========================= */

document
    .getElementById("closePhone")
    .addEventListener("click",function(){

        document
            .getElementById("phone")
            .style.display = "none";

    });


/* =========================
   SHOP
========================= */

document
    .getElementById("openShop")
    .addEventListener("click",function(){

        window.location.href = "shop.html";

    });


/* =========================
   BANK
========================= */

document
    .getElementById("openBank")
    .addEventListener("click",function(){

        window.location.href = "bank.html";

    });


/* =========================
   CLOCK
========================= */

function updateTime(){

    const now = new Date();

    const hours =
        String(now.getHours()).padStart(2,"0");

    const minutes =
        String(now.getMinutes()).padStart(2,"0");

    document
        .getElementById("time")
        .textContent =
            hours + ":" + minutes;

}

updateTime();

setInterval(updateTime,1000);

</script>

</body>
</html>
