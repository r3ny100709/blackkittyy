<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Cat Game</title>


<style>

/* =====================================================
   BASIC
===================================================== */

*{
    box-sizing:border-box;
}


html,
body{

    margin:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#777;

}


body{

    font-family:
        Arial,
        sans-serif;

}


/* =====================================================
   GAME
===================================================== */

.game{

    position:relative;

    width:100vw;
    height:100vh;

    overflow:hidden;

}


/* =====================================================
   CAT
===================================================== */

#catImage{

    position:absolute;

    left:50%;
    top:55%;

    width:180px;

    height:auto;

    transform:
        translate(-50%, -50%);

    object-fit:contain;

    user-select:none;

    -webkit-user-select:none;

    -webkit-user-drag:none;

    pointer-events:none;

}

</style>

</head>


<body>


<!-- =====================================================
     GAME
===================================================== -->

<main class="game">

    <img
        id="catImage"
        src="Sit"
        alt="แมว"
    >

</main>


<script>

/*
=====================================================
# ระบบแมว
=====================================================

Sit        = ปกติ
Yawn       = หาว
Bored      = เบื่อ
Run_left   = เดินซ้าย
Run_right  = เดินขวา
Sleep      = นอน
Wet        = เปียก

=====================================================
*/


const catImage =
    document.getElementById("catImage");


/* =====================================================
   CAT STATE
===================================================== */

let catState = "Sit";

let catX = 50;

let catY = 55;

let direction = 1;


/* =====================================================
   เปลี่ยนท่าแมว
===================================================== */

function setCatPose(pose){

    catState = pose;

    catImage.src = pose;

}


/* =====================================================
   อัปเดตตำแหน่ง
===================================================== */

function updateCatPosition(){

    catImage.style.left =
        catX + "%";

    catImage.style.top =
        catY + "%";

}


/* =====================================================
   เดิน
===================================================== */

function moveCat(){


    /*
       ถ้านอนอยู่
       ไม่เดิน
    */

    if(catState === "Sleep"){

        return;

    }


    /*
       ถ้าเปียกอยู่
       ไม่เดิน
    */

    if(catState === "Wet"){

        return;

    }


    /*
       ถ้ากำลังเดินอยู่
       ไม่เริ่มซ้ำ
    */

    if(
        catState === "Run_left" ||
        catState === "Run_right"
    ){

        return;

    }


    /* -----------------------------------------------
       สุ่มทิศทาง
    ------------------------------------------------ */

    direction =
        Math.random() < 0.5
        ? -1
        : 1;


    if(direction === -1){

        setCatPose("Run_left");

    }
    else{

        setCatPose("Run_right");

    }


    /* -----------------------------------------------
       สุ่มระยะทาง
    ------------------------------------------------ */

    const distance =
        8 +
        Math.random() * 18;


    const startX =
        catX;


    let targetX =
        catX +
        distance * direction;


    /*
       ไม่ให้แมวออกนอกพื้นที่
    */

    targetX =
        Math.max(
            10,
            Math.min(
                90,
                targetX
            )
        );


    /* -----------------------------------------------
       ความเร็วเดิน
    ------------------------------------------------ */

    const duration =
        1200 +
        Math.random() * 1000;


    const startTime =
        performance.now();


    /* -----------------------------------------------
       Animation
    ------------------------------------------------ */

    function walk(currentTime){


        const progress =
            Math.min(
                (
                    currentTime -
                    startTime
                ) / duration,
                1
            );


        /*
           ทำให้เดินนุ่มขึ้น
        */

        const ease =
            progress < 0.5

            ? 2 *
              progress *
              progress

            : 1 -
              Math.pow(
                  -2 * progress + 2,
                  2
              ) / 2;


        catX =
            startX +
            (
                targetX -
                startX
            ) *
            ease;


        updateCatPosition();


        /*
           ยังเดินไม่เสร็จ
        */

        if(progress < 1){

            requestAnimationFrame(
                walk
            );

        }


        /*
           เดินเสร็จ
        */

        else{

            catX =
                targetX;

            updateCatPosition();

            setCatPose("Sit");

        }

    }


    requestAnimationFrame(
        walk
    );

}


/* =====================================================
   AUTO WALK
===================================================== */

/*
   แมวจะสุ่มเดินทุก 7–16 วินาที
*/

function scheduleNextWalk(){


    const delay =
        7000 +
        Math.random() * 9000;


    setTimeout(

        function(){

            moveCat();

            scheduleNextWalk();

        },

        delay

    );

}


/* =====================================================
   YAWN
===================================================== */

/*
   ทุก 1 นาที

   Sit
     ↓
   Yawn
     ↓
   2 วินาที
     ↓
   Sit
*/

setInterval(

    function(){


        /*
           ถ้ากำลังทำอย่างอื่นอยู่
           ไม่ขัดจังหวะ
        */

        if(
            catState === "Sleep" ||
            catState === "Wet" ||
            catState === "Run_left" ||
            catState === "Run_right"
        ){

            return;

        }


        setCatPose("Yawn");


        /*
           หาว 2 วินาที
        */

        setTimeout(

            function(){

                if(
                    catState === "Yawn"
                ){

                    setCatPose("Sit");

                }

            },

            2000

        );

    },

    60000

);


/* =====================================================
   BORED
===================================================== */

/*
   ทุก 5 นาที

   Sit
     ↓
   Bored
     ↓
   3 วินาที
     ↓
   Sit
*/

setInterval(

    function(){


        /*
           ไม่ขัดจังหวะ
           ตอนนอน / เปียก / เดิน
        */

        if(
            catState === "Sleep" ||
            catState === "Wet" ||
            catState === "Run_left" ||
            catState === "Run_right"
        ){

            return;

        }


        setCatPose("Bored");


        /*
           เบื่อ 3 วินาที
        */

        setTimeout(

            function(){

                if(
                    catState === "Bored"
                ){

                    setCatPose("Sit");

                }

            },

            3000

        );

    },

    300000

);


/* =====================================================
   START
===================================================== */

setCatPose("Sit");

updateCatPosition();

scheduleNextWalk();

</script>


</body>

</html>
