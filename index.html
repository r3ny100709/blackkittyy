<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Cat Room</title>


<style>

/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  width:100%;
  min-height:100%;
}

body{

  background:#171717;

  color:#fff;

  font-family:
    Arial,
    "Noto Sans Thai",
    sans-serif;

  overflow:hidden;

}


/* =====================================================
   GAME — 9:16
===================================================== */

.game{

  position:relative;

  width:min(100vw, 56.25vh);

  height:min(100vh, 177.7778vw);

  margin:0 auto;

  overflow:hidden;

  background:#777;

}


/* =====================================================
   WALL
===================================================== */

.wall{

  position:absolute;

  inset:0 0 32% 0;

  background:
    linear-gradient(
      to bottom,
      #999999 0%,
      #858585 100%
    );

}


/* =====================================================
   FLOOR
===================================================== */

.floor{

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:32%;

  background:
    linear-gradient(
      to bottom,
      #6d6d6d,
      #555555
    );

}


/* subtle floor lines */

.floor::before{

  content:"";

  position:absolute;

  inset:0;

  opacity:.10;

  background:
    repeating-linear-gradient(
      0deg,
      transparent 0,
      transparent 40px,
      #fff 41px,
      transparent 42px
    );

}


/* =====================================================
   LIGHT
===================================================== */

.light{

  position:absolute;

  width:100%;
  height:55%;

  top:-18%;
  left:0;

  pointer-events:none;

  background:
    radial-gradient(
      ellipse at center,
      rgba(255,255,255,.18),
      transparent 68%
    );

}


/* =====================================================
   OBJECTS
===================================================== */

.object{

  position:absolute;

  user-select:none;

}


/* =====================================================
   CAT BED
===================================================== */

.cat-bed{

  left:6%;

  bottom:9%;

  width:43%;

  height:20%;

}


.bed-outer{

  position:absolute;

  left:0;
  bottom:0;

  width:100%;
  height:72%;

  border-radius:
    48%
    48%
    28%
    28%;

  background:
    linear-gradient(
      145deg,
      #c0c0c0,
      #858585
    );

  border:
    2px solid #666;

  box-shadow:
    0 10px 18px
    rgba(0,0,0,.28);

}


.bed-inner{

  position:absolute;

  left:9%;
  bottom:17%;

  width:82%;
  height:53%;

  border-radius:50%;

  background:
    radial-gradient(
      ellipse,
      #9d9d9d,
      #6f6f6f
    );

  border:
    2px solid #666;

}


.bed-pillow{

  position:absolute;

  left:28%;
  bottom:29%;

  width:44%;
  height:28%;

  border-radius:50%;

  background:#aaa;

}


.bed-label{

  position:absolute;

  left:0;
  bottom:-18%;

  width:100%;

  text-align:center;

  color:#ddd;

  font-size:10px;

  letter-spacing:1px;

}


/* =====================================================
   FOOD + WATER
===================================================== */

.bowls{

  right:6%;

  bottom:9%;

  width:40%;

  height:17%;

}


.bowl{

  position:absolute;

  bottom:0;

  width:42%;

  height:54%;

  border-radius:
    12%
    12%
    45%
    45%;

  background:
    linear-gradient(
      to bottom,
      #c0c0c0,
      #777
    );

  border:
    2px solid #5a5a5a;

  box-shadow:
    0 8px 10px
    rgba(0,0,0,.25);

}


.bowl.food{
  left:4%;
}


.bowl.water{
  right:4%;
}


.bowl::before{

  content:"";

  position:absolute;

  left:10%;
  right:10%;

  top:10%;

  height:42%;

  border-radius:50%;

  background:#424242;

}


.bowl.food::after{

  content:"";

  position:absolute;

  left:18%;
  right:18%;

  top:18%;

  height:25%;

  border-radius:50%;

  background:#555;

}


.bowl.water::after{

  content:"";

  position:absolute;

  left:17%;
  right:17%;

  top:20%;

  height:18%;

  border-radius:50%;

  background:#8d9aa0;

}


.bowl-label{

  position:absolute;

  bottom:-30%;

  width:42%;

  text-align:center;

  color:#ddd;

  font-size:9px;

}


.food-label{
  left:4%;
}

.water-label{
  right:4%;
}


/* =====================================================
   CAT TOY
===================================================== */

.cat-toy{

  left:50%;

  top:40%;

  width:31%;

  height:32%;

  transform:
    translateX(-50%);

}


.toy-base{

  position:absolute;

  left:16%;

  bottom:0;

  width:68%;

  height:13%;

  border-radius:50%;

  background:
    linear-gradient(
      to bottom,
      #c5c5c5,
      #777
    );

  border:
    2px solid #555;

}


.toy-pole{

  position:absolute;

  left:48%;

  bottom:10%;

  width:4%;

  height:68%;

  background:
    linear-gradient(
      to right,
      #444,
      #aaa,
      #444
    );

  border-radius:10px;

}


.toy-arm{

  position:absolute;

  left:49%;

  top:18%;

  width:45%;

  height:4%;

  background:#555;

  border-radius:10px;

  transform:
    rotate(-25deg);

  transform-origin:left center;

}


.toy-ball{

  position:absolute;

  right:0;

  top:0;

  width:28px;

  height:28px;

  border-radius:50%;

  background:
    linear-gradient(
      135deg,
      #ff5c7a,
      #ffd34d 45%,
      #55d6c2
    );

}


.toy-feather{

  position:absolute;

  left:48%;

  top:6%;

  width:16px;

  height:28px;

  border-radius:
    70%
    20%
    70%
    20%;

  background:
    linear-gradient(
      135deg,
      #ff5c7a,
      #9d75ff
    );

  transform:
    rotate(18deg);

}


.toy-label{

  position:absolute;

  left:0;
  right:0;

  bottom:-15%;

  text-align:center;

  color:#ddd;

  font-size:10px;

}


/* =====================================================
   CAT
===================================================== */

.cat{

  position:absolute;

  left:50%;

  bottom:24%;

  width:44%;

  transform:
    translateX(-50%);

  z-index:20;

  pointer-events:none;

  user-select:none;

  transition:
    left 2.4s ease-in-out;

}


/*
   รูปแมวของเธอเป็นไฟล์ชื่อ:
   Sit
   Bored
   Run_left
   Run_right
   Sleep
   Wet
   Yawn

   ไม่มี .png ต่อท้าย
*/

.cat img{

  display:block;

  width:100%;

  height:auto;

  max-height:32vh;

  object-fit:contain;

  object-position:center bottom;

  pointer-events:none;

  user-select:none;

  -webkit-user-drag:none;

}


/* =====================================================
   CAT SHADOW
===================================================== */

.cat-shadow{

  position:absolute;

  left:50%;

  bottom:0;

  width:48%;

  height:10px;

  transform:
    translateX(-50%);

  border-radius:50%;

  background:
    rgba(0,0,0,.32);

  filter:
    blur(4px);

  z-index:-1;

}


/* =====================================================
   SMALL INFO
===================================================== */

.design-info{

  position:absolute;

  top:14px;

  left:14px;

  padding:
    5px
    9px;

  border-radius:8px;

  background:
    rgba(0,0,0,.25);

  color:#ddd;

  font-size:9px;

  letter-spacing:.5px;

  opacity:.65;

  z-index:50;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:430px){

  .design-info{
    display:none;
  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion:reduce){

  *{

    animation:none !important;

    transition:none !important;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     GAME
===================================================== -->

<main class="game">


  <div class="wall"></div>

  <div class="floor"></div>

  <div class="light"></div>


  <!-- ===================================================
       CAT BED
  ==================================================== -->

  <div class="object cat-bed">

    <div class="bed-outer"></div>

    <div class="bed-inner"></div>

    <div class="bed-pillow"></div>

    <div class="bed-label">
      CAT BED
    </div>

  </div>


  <!-- ===================================================
       FOOD / WATER
  ==================================================== -->

  <div class="object bowls">

    <div class="bowl food"></div>

    <div class="bowl water"></div>

    <div class="bowl-label food-label">
      FOOD
    </div>

    <div class="bowl-label water-label">
      WATER
    </div>

  </div>


  <!-- ===================================================
       CAT TOY
  ==================================================== -->

  <div class="object cat-toy">

    <div class="toy-base"></div>

    <div class="toy-pole"></div>

    <div class="toy-arm"></div>

    <div class="toy-ball"></div>

    <div class="toy-feather"></div>

    <div class="toy-label">
      CAT TOY
    </div>

  </div>


  <!-- ===================================================
       CAT
  ==================================================== -->

  <div
    id="cat"
    class="cat"
  >

    <div class="cat-shadow"></div>

    <img
      id="catImage"
      src="Sit"
      alt="Black cat"
      draggable="false"
    >

  </div>


  <div class="design-info">
    CAT ROOM • PROTOTYPE
  </div>


</main>


<script>

/* =====================================================
   CAT FILES
===================================================== */

const CAT_IMAGES = {

  Sit:
    "Sit",

  Bored:
    "Bored",

  Run_left:
    "Run_left",

  Run_right:
    "Run_right",

  Sleep:
    "Sleep",

  Wet:
    "Wet",

  Yawn:
    "Yawn"

};


/* =====================================================
   ELEMENTS
===================================================== */

const cat =
  document.getElementById("cat");

const catImage =
  document.getElementById("catImage");


/* =====================================================
   CAT STATE
===================================================== */

let catPosition = 50;

let catBusy = false;


/* =====================================================
   SET CAT IMAGE
===================================================== */

function setCat(type){

  const file =
    CAT_IMAGES[type];

  if(!file){
    return;
  }

  catImage.src =
    file;

}


/* =====================================================
   WAIT
===================================================== */

function wait(ms){

  return new Promise(
    resolve =>
      setTimeout(resolve, ms)
  );

}


/* =====================================================
   SIT
===================================================== */

function sit(){

  setCat("Sit");

}


/* =====================================================
   YAWN
   ทุก 1 นาที
===================================================== */

async function doYawn(){

  if(catBusy){
    return;
  }

  catBusy = true;

  setCat("Yawn");

  await wait(3000);

  sit();

  catBusy = false;

}


/* =====================================================
   BORED
   ทุก 5 นาที
===================================================== */

async function doBored(){

  if(catBusy){
    return;
  }

  catBusy = true;

  setCat("Bored");

  await wait(4000);

  sit();

  catBusy = false;

}


/* =====================================================
   WALK
===================================================== */

async function walk(direction){

  if(catBusy){
    return;
  }

  catBusy = true;


  /*
     ระยะทางในการเดิน
  */

  const distance =
    18 +
    Math.random() * 22;


  /* -----------------------------------------------
     เดินซ้าย
  ------------------------------------------------ */

  if(direction === "left"){

    catPosition =
      Math.max(
        12,
        catPosition - distance
      );

    setCat("Run_left");

  }


  /* -----------------------------------------------
     เดินขวา
  ------------------------------------------------ */

  else{

    catPosition =
      Math.min(
        88,
        catPosition + distance
      );

    setCat("Run_right");

  }


  /*
     ขยับตัวแมว
  */

  cat.style.left =
    catPosition + "%";


  /*
     เวลาเดิน
  */

  await wait(2400);


  /*
     กลับมานั่ง
  */

  sit();

  catBusy = false;

}


/* =====================================================
   RANDOM WALK
===================================================== */

async function randomWalk(){

  if(catBusy){
    return;
  }


  let direction;


  /*
     ป้องกันแมวเดินออกขอบ
  */

  if(catPosition <= 25){

    direction =
      "right";

  }

  else if(catPosition >= 75){

    direction =
      "left";

  }

  else{

    direction =
      Math.random() < .5
        ? "left"
        : "right";

  }


  await walk(direction);

}


/* =====================================================
   AUTOMATIC WALK
===================================================== */

function scheduleWalk(){

  const delay =
    7000 +
    Math.random() * 8000;


  setTimeout(
    async () => {

      await randomWalk();

      scheduleWalk();

    },
    delay
  );

}


/* =====================================================
   REAL TIME YAWN
===================================================== */

/*
   ทุก 60 วินาที
*/

setInterval(
  doYawn,
  60 * 1000
);


/* =====================================================
   REAL TIME BORED
===================================================== */

/*
   ทุก 5 นาที
*/

setInterval(
  doBored,
  5 * 60 * 1000
);


/* =====================================================
   PRELOAD
===================================================== */

Object.values(CAT_IMAGES).forEach(
  file => {

    const image =
      new Image();

    image.src =
      file;

  }
);


/* =====================================================
   START
===================================================== */

setCat("Sit");

cat.style.left =
  catPosition + "%";


scheduleWalk();


</script>


</body>

</html>
